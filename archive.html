<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive | SARKA</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,slnt,wdth,wght@8..144,-10..0,25..151,100..1000&display=swap" rel="stylesheet">
<style>
html,body{
margin:0;padding:0;width:100%;
font-family:"Roboto Flex",sans-serif;
font-weight:650;
font-stretch:151%;
letter-spacing:-0.05em;
transition:background-color .1s,color .1s;
overflow-x:hidden;
}
.light-theme{background:#FFF200;color:#1200FF;}
.dark-theme{background:#1200FF;color:#FFF200;}
.light-theme .logo,
.light-theme .top-nav,
.light-theme .lang-switch,
.light-theme .archive-text{
filter:invert(1);
}
.top-nav{
position:fixed;top:30px;left:50%;transform:translateX(-50%);
display:flex;gap:4rem;font-size:1.1rem;z-index:100;
transition:opacity .3s;user-select:none;
}
.top-nav.hidden{opacity:0;pointer-events:none;}
.top-nav a{color:inherit;text-decoration:none;}
.logo{position:fixed;top:30px;left:40px;height:1.5rem;z-index:101;}
.lang-switch{position:fixed;top:30px;right:40px;z-index:101;cursor:pointer;}
.lang-active{text-decoration:underline;}
main{
padding-top:150px;
padding-left:8vw;
padding-right:8vw;
}
.archive-text{
font-size:1rem;
line-height:1.6;
margin-bottom:6rem;
}
.archive-text div{margin-bottom:.2rem;}
.archive-image{
margin:0 0 8rem 0;
}
.archive-image img{
display:block;
width:100%;
max-width:1400px;
height:auto;
filter:none!important;
}
.end{
margin:8rem 0 6rem;
font-size:1rem;
}
@media(max-width:768px){
.top-nav{top:80px;gap:1.5rem;}
main{padding-top:150px;padding-left:7vw;padding-right:7vw;}
}
</style>
</head>
<body class="dark-theme">

<img src="sarka-logo.svg" class="logo" alt="SARKA">

<nav class="top-nav">
<a href="index.html">Home</a>
<a href="music.html">Music</a>
<a href="archive.html">Archive</a>
</nav>

<div class="lang-switch">
<span class="lang lang-active">EN</span> /
<span class="lang">GR</span>
</div>

<main>

<section class="archive-text">
<div>ARCHIVE 001</div>
<div>2026</div>
<div>ERASMUS+ ROME</div>
</section>

<section class="archive-image">
<img src="assets/archive/erasmus/001.webp" loading="lazy" alt="">
</section>

<section class="archive-image">
<img src="assets/archive/erasmus/002.webp" loading="lazy" alt="">
</section>

<section class="archive-image">
<img src="assets/archive/erasmus/003.webp" loading="lazy" alt="">
</section>

<section class="archive-image">
<img src="assets/archive/erasmus/004.webp" loading="lazy" alt="">
</section>

<section class="end">001 END</section>

</main>

<script>
const nav=document.querySelector('.top-nav');
window.addEventListener('scroll',()=>nav.classList.toggle('hidden',window.scrollY>50));

function switchTheme(){
document.body.classList.toggle('light-theme');
document.body.classList.toggle('dark-theme');
}

if(('ontouchstart' in window)||(navigator.maxTouchPoints>0)){
let lastSwitchTime=0;
const throttleDelay=100;
window.addEventListener('scroll',()=>{
const now=Date.now();
if(now-lastSwitchTime>throttleDelay){
switchTheme();
lastSwitchTime=now;
}
},{passive:true});
}

function setLanguage(lang){
localStorage.setItem('userLanguage',lang);
document.querySelectorAll('.lang').forEach(el=>{
el.classList.toggle('lang-active',el.textContent.trim().toLowerCase()===lang);
});
}

window.addEventListener('DOMContentLoaded',()=>{
setLanguage(localStorage.getItem('userLanguage')||'en');
});

document.querySelectorAll('.lang').forEach(el=>{
el.addEventListener('click',()=>setLanguage(el.textContent.trim().toLowerCase()));
});
</script>

</body>
</html>
