<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive | SARKA</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,slnt,wdth,wght@8..144,-10..0,25..151,100..1000&display=swap" rel="stylesheet">
<style>
html, body {
  margin: 0; padding: 0; width: 100%;
  font-family: "Roboto Flex", sans-serif; font-weight: 650;
  font-stretch: 151%; letter-spacing: -0.05em;
  transition: background-color 0.1s ease, color 0.1s ease;
  overflow-x: hidden;
}
.light-theme { background-color: #FFF200; color: #1200FF; }
.dark-theme { background-color: #1200FF; color: #FFF200; }
.light-theme .logo { filter: invert(1); }
.top-nav{
position:fixed;top:30px;left:50%;transform:translateX(-50%);
display:flex;gap:4rem;font-size:1.1rem;z-index:100;
transition:opacity .3s;user-select:none;
}
.top-nav.hidden{opacity:0;pointer-events:none;}
.top-nav a{color:inherit;text-decoration:none;}
.logo{position:fixed;top:30px;left:40px;height:1.5rem;z-index:101;}
.lang-switch{position:fixed;top:30px;right:40px;z-index:101;cursor:pointer;}
.lang-active{text-decoration:underline;}
main{
padding-top:150px;
padding-left:8vw;
padding-right:8vw;
}
.archive-text{
font-size:0.85rem;
line-height:1.6;
margin-bottom:3rem;
}
.archive-text div{margin-bottom:.2rem;}
.archive-image{
margin:0 0 4rem 0;
}
.archive-image img{
display:block;
width:100%;
max-width:1400px;
height:auto;
filter:none!important;
}
.end{
margin:4rem 0 3rem;
font-size:0.85rem;
}
@media(max-width:768px){
.top-nav{top:80px;gap:1.5rem;}
main{padding-top:150px;padding-left:7vw;padding-right:7vw;}
}
</style>
</head>
<body class="dark-theme">

<img src="sarka-logo.svg" class="logo" alt="SARKA">

<nav class="top-nav" data-lang-en="Home,Music,Archive" data-lang-gr="Αρχική,Μουσική,Αρχείο">
<a href="index.html">Home</a>
<a href="music.html">Music</a>
<a href="archive.html">Archive</a>
</nav>

<div class="lang-switch">
<span class="lang lang-active">EN</span> /
<span class="lang">GR</span>
</div>

<main>

<section class="archive-text" data-lang-en="ARCHIVE 001<br><br>2026<br>ERASMUS+ ROME" data-lang-gr="ΑΡΧΕΙΟ 001<br><br>2026<br>ERASMUS+ ΡΩΜΗ">
<div>ARCHIVE 001</div>
<div>2026</div>
<div>ERASMUS+ ROME</div>
</section>

<section class="archive-image">
<img src="assets/archive/erasmus/001.webp" loading="lazy" alt="">
</section>

<section class="archive-image">
<img src="assets/archive/erasmus/002.webp" loading="lazy" alt="">
</section>

<section class="archive-image">
<img src="assets/archive/erasmus/003.webp" loading="lazy" alt="">
</section>

<section class="archive-image">
<img src="assets/archive/erasmus/004.webp" loading="lazy" alt="">
</section>

<section class="end" data-lang-en="001 END" data-lang-gr="001 ΤΕΛΟΣ">001 END</section>

</main>

<script>
	const nav = document.querySelector('.top-nav');
	window.addEventListener('scroll', () => {
		nav.classList.toggle('hidden', window.scrollY > 50);
	});

	function switchTheme() { 
        document.body.classList.toggle('light-theme'); 
        document.body.classList.toggle('dark-theme'); 
    }
	
    if (('ontouchstart' in window) || (navigator.maxTouchPoints > 0)) { 
        let lastSwitchTime = 0; 
        const throttleDelay = 100;
        window.addEventListener('scroll', () => {
            const now = Date.now();
            if (now - lastSwitchTime > throttleDelay) {
                switchTheme();
                lastSwitchTime = now;
            }
        }, { passive: true });
    }

    function setLanguage(lang) {
        localStorage.setItem('userLanguage', lang);
        document.querySelectorAll('.lang').forEach(el => {
            el.classList.toggle('lang-active', el.textContent.trim().toLowerCase() === lang);
        });

        const navLabels = document.querySelector('.top-nav').getAttribute(`data-lang-${lang}`).split(",");
        document.querySelectorAll('.top-nav a').forEach((a, i) => a.textContent = navLabels[i]);

        const archiveText = document.querySelector('.archive-text');
        archiveText.innerHTML = archiveText.getAttribute('data-lang-' + lang);

        const end = document.querySelector('.end');
        end.textContent = end.getAttribute('data-lang-' + lang);

        document.title = lang === 'gr' ? 'Αρχείο | SARKA' : 'Archive | SARKA';
    }

    window.addEventListener('DOMContentLoaded', () => {
        const savedLang = localStorage.getItem('userLanguage') || 'en';
        setLanguage(savedLang);
    });

	document.querySelectorAll('.lang').forEach(el => {
	  el.addEventListener('click', function() {
	    const lang = this.textContent.trim().toLowerCase();
        setLanguage(lang);
	  });
	});
</script>

</body>
</html>
