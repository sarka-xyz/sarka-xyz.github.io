<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music | SARKA</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,slnt,wdth,wght@8..144,-10..0,25..151,100..1000&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; min-height: 100vh;
            font-family: "Roboto Flex", sans-serif; font-weight: 650;
            font-stretch: 151%; letter-spacing: -0.05em;
            transition: background-color 0.1s ease, color 0.1s ease;
            overflow-x: hidden;
        }

        /* Theme Styles */
        .light-theme { background-color: #FFF200; color: #1200FF; }
        .dark-theme { background-color: #1200FF; color: #FFF200; }
        .light-theme .logo { filter: invert(1); }

        /* Navigation */
        .top-nav {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 4rem; font-size: 1.1rem; z-index: 100;
            transition: opacity 0.3s ease; user-select: none;
        }
        .top-nav.hidden { opacity: 0; pointer-events: none; }
        .top-nav a { color: inherit; text-decoration: none; }

        .logo { position: fixed; top: 30px; left: 40px; height: 1.5rem; z-index: 101; }
        .lang-switch { position: fixed; top: 30px; right: 40px; z-index: 101; cursor: pointer; }
        .lang-active { text-decoration: underline; }

        /* Music Grid */
        .music-grid {
            width: min(55vw, 1040px);
            padding: 150px 0 50px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 3rem 60px;
        }
        .release { display: flex; flex-direction: column; align-items: flex-start; }
        .release > a:first-child { display: block; width: 100%; }
        .release img {
            display: block; width: 100%; aspect-ratio: 1/1; object-fit: cover;
            border-radius: 4px; transform-origin: center;
            transition: transform 240ms cubic-bezier(.2,.75,.25,1);
        }
        .release > a:first-child:hover img,
        .release > a:first-child:focus-visible img { transform: translateY(-6px) scale(1.025); }
        .release a { color: inherit; text-decoration: none; }
        .album-title { margin-top: 0.75rem; text-decoration: underline; }
        .release.hmih { order: 1; }
        .release.no-cost { order: 2; }
        @media (prefers-reduced-motion: reduce) {
            .release img { transition: none; }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .top-nav { top: 80px; gap: 1.5rem; }
            .music-grid {
                width: min(75vw, 500px);
                grid-template-columns: 1fr;
                gap: 3rem;
                padding-top: 180px;
            }
            .release.no-cost { order: 1; }
            .release.hmih { order: 2; }
            .album-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body class="dark-theme">
    <img src="sarka-logo.svg" alt="SARKA logo" class="logo" />
    <nav class="top-nav" data-lang-en="Home,Music,Archive" data-lang-gr="Αρχική,Μουσική,Αρχείο">
        <a href="index.html">Home</a>
        <a href="music.html">Music</a>
        <a href="archive.html">Archive</a>
    </nav>

    <div class="music-grid">
        <!-- Reusable function for release structure -->
        <div class="release no-cost">
            <a href="https://push.fm/fl/nocost"><img src="NC.jpg" alt="No Cost" /></a>
            <a href="https://push.fm/fl/nocost" class="album-title">No Cost</a>
        </div>
        <div class="release hmih">
            <a href="https://push.fm/fl/hmih"><img src="HMIH.jpg" alt="Haus Made in Haus" /></a>
            <a href="https://push.fm/fl/hmih" class="album-title">Haus Made In Haus</a>
        </div>

    </div>

    <div class="lang-switch">
        <span class="lang lang-active">EN</span> / <span class="lang">GR</span>
    </div>

    <script>
        const nav = document.querySelector('.top-nav');
        window.addEventListener('scroll', () => { nav.classList.toggle('hidden', window.scrollY > 50); });

        function switchTheme() {
            document.body.classList.toggle('light-theme');
            document.body.classList.toggle('dark-theme');
        }

        function flashWhileActive(eventName) {
            let flashInterval;
            let idleTimeout;
            const startFlashing = () => {
                if (!flashInterval) {
                    switchTheme();
                    flashInterval = window.setInterval(switchTheme, 120);
                }
                window.clearTimeout(idleTimeout);
                idleTimeout = window.setTimeout(() => {
                    window.clearInterval(flashInterval);
                    flashInterval = undefined;
                }, 180);
            };
            window.addEventListener(eventName, startFlashing, { passive: true });
        }

        if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
            flashWhileActive('pointermove');
        } else {
            flashWhileActive('scroll');
        }

        function setLanguage(lang) {
            const language = lang === 'gr' ? 'gr' : 'en';
            localStorage.setItem('userLanguage', language);
            document.documentElement.lang = language;
            document.querySelectorAll('.lang').forEach(el => {
                el.classList.toggle('lang-active', el.textContent.trim().toLowerCase() === language);
            });
            const navLabels = nav.getAttribute(`data-lang-${language}`).split(',');
            nav.querySelectorAll('a').forEach((link, index) => { link.textContent = navLabels[index]; });
            document.title = language === 'gr' ? 'Μουσική | SARKA' : 'Music | SARKA';
        }

        document.querySelectorAll('.lang').forEach(el => {
            el.addEventListener('click', () => setLanguage(el.textContent.trim().toLowerCase()));
        });

        setLanguage(localStorage.getItem('userLanguage') || 'en');
    </script>
</body>
</html>
